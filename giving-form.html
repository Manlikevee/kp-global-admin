</head><body data-page="giving"><div class="app" id="app"><aside class="side" id="side"></aside><div class="scrim" id="scrim"></div>
<main class="main"><div class="top"><button class="ib ham" id="ham" aria-label="Open menu"></button><div class="crumb"><a href="dashboard.html">KP Global</a> / <a href="giving.html">Giving &amp; Offerings</a> / <b>Add category</b></div>

<div class="ph"><div><h1 data-te="Edit giving category">Add category</h1><div class="sub" data-te="Update the details below, then save your changes.">Fill in the details below. You can edit this later.</div></div></div>
<form class="fgrid" data-saved="Category saved" data-edit-title="Edit giving category" data-next="giving.html">
<div class="card"><div class="f wide"><label>Category name<input name="name" type="text" placeholder="e.g. Missions" data-edit="Building fund" required></label><label>Description<textarea name="desc" rows="3" placeholder="Shown to members when they give" data-edit="Gifts towards the new church building."></textarea></label><label>Target amount<input name="target" type="number" placeholder="Optional" data-edit="50000"></label></div></div>

<button class="btn p big" type="submit" data-te="Save changes">Add category</button>
<a class="btn big" href="giving.html" style="justify-content:center">Cancel</a>
<a class="btn d big only-edit" href="#" style="justify-content:center" data-confirm="Delete this giving category?" data-msg="It will be removed from the app straight away." data-done="Giving category deleted" data-go="giving.html"><span data-i="trash"></span> Delete giving category</a></div></div></div>
