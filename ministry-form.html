<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add ministry · KP Global Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head><body data-page="ministries"><div class="app" id="app"><aside class="side" id="side"></aside><div class="scrim" id="scrim"></div>
<main class="main"><div class="top"><button class="ib ham" id="ham" aria-label="Open menu"></button><div class="crumb"><a href="dashboard.html">KP Global</a> / <a href="ministries.html">Departments &amp; Ministries</a> / <b>Add ministry</b></div>
<div class="tools"><a class="ib" href="notifications.html" aria-label="Notifications"><span data-i="notify"></span><span class="dot"></span></a><button class="ib" id="theme"></button></div></div>
<div class="stage"><a class="back" href="ministries.html"><span data-i="back"></span>Departments & Ministries</a>
<div class="ph"><div><h1 data-te="Edit ministry">Add ministry</h1><div class="sub" data-te="Update the details below, then save your changes.">Fill in the details below. You can edit this later.</div></div></div>
<form class="fgrid" data-saved="Ministry saved" data-edit-title="Edit ministry" data-next="ministries.html">
<div class="card"><div class="f wide"><label>Ministry name<input name="name" type="text" placeholder="e.g. Choir" data-edit="Choir" required></label><label>Leader<input name="leader" type="text" placeholder="Choose a member" data-edit="Ruth Bello"></label><label>Description<textarea name="desc" rows="4" placeholder="What does this ministry do?" data-edit="Leads worship every Sunday and at special services."></textarea><small>Shown to members in the app.</small></label><label>Meeting times<textarea name="times" rows="2" placeholder="When does it meet?" data-edit="Thursday 7:00 PM. Saturday 10:00 AM."></textarea></label></div></div>
<div class="side-c"><div class="card"><div class="f wide"><label>Status<select name="status" data-edit="Active"><option selected>Active</option><option>Draft</option></select></label><label class="c"><input type="checkbox" name="join" data-edit="1" checked> Members can request to join</label>
<button class="btn p big" type="submit" data-te="Save changes">Add ministry</button>
<a class="btn big" href="ministries.html" style="justify-content:center">Cancel</a>
<a class="btn d big only-edit" href="#" style="justify-content:center" data-confirm="Delete this ministry?" data-msg="It will be removed from the app straight away." data-done="Ministry deleted" data-go="ministries.html"><span data-i="trash"></span> Delete ministry</a></div></div></div>
