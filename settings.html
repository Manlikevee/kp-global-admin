<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head><body data-page="settings"><div class="app" id="app"><aside class="side" id="side"></aside><div class="scrim" id="scrim"></div>

<div class="stage"><div class="ph"><div><h1>Settings</h1><div class="sub">Church profile and platform preferences</div></div><div class="acts"></div></div>
<div class="set"><div class="vtabs card" style="padding:8px"><button class="on" data-t="p">Church profile</button><button data-t="n">Notifications</button><button data-t="m">Content approval</button></div>
