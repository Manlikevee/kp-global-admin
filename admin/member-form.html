<div class="ph"><div><h1 data-te="Edit member">Add member</h1><div class="sub" data-te="Update the details below, then save your changes.">Fill in the details below. You can edit this later.</div></div></div>
<form class="fgrid" data-saved="Member saved" data-edit-title="Edit member" data-next="members.html">
<div class="card"><div class="f wide"><label>Full name<input name="name" type="text" placeholder="Full name" data-edit="Grace Adeyemi" required></label><div class="cols"><label>Email<input name="email" type="email" placeholder="name@example.org" data-edit="grace.adeyemi@example.org" required></label><label>Phone<input name="phone" type="tel" placeholder="+234…" data-edit="+234 801 234 5678"></label></div><div class="cols"><label>Role<select name="role" data-edit="Member"><option selected>Member</option><option>Usher</option><option>Youth leader</option><option>Choir leader</option><option>Pastor</option><option>Admin</option></select></label><label>Birthday<input name="dob" type="date" placeholder="" data-edit="2000-03-03"></label></div></div></div>
