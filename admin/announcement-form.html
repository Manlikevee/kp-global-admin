<div class="ph"><div><h1 data-te="Edit announcement">New announcement</h1><div class="sub" data-te="Update the details below, then save your changes.">Fill in the details below. You can edit this later.</div></div></div>
<form class="fgrid" data-saved="Announcement saved" data-edit-title="Edit announcement" data-next="announcements.html">
<div class="card"><div class="f wide"><label>Title<input name="title" type="text" placeholder="Announcement title" data-edit="Annual thanksgiving service" required></label><label>Message<textarea name="msg" rows="5" placeholder="What should members know?" data-edit="Join us on 25 October for a special service of thanks. Invite a friend and stay for lunch after the service."></textarea></label><div class="cols"><label>Audience<select name="aud" data-edit="Everyone"><option selected>Everyone</option><option>Ministries</option><option>Youth</option><option>Choir</option><option>Ushers</option></select></label><label>Expires<input name="exp" type="date" placeholder="" data-edit="2026-10-26"></label></div></div></div>
<div class="side-c"><div class="card"><div class="f wide"><label>Status<select name="status" data-edit="Published"><option selected>Draft</option><option>Scheduled</option><option>Published</option></select></label><label class="c"><input type="checkbox" name="pin" data-edit="1" checked> Pin to the top of the app</label><label class="c"><input type="checkbox" name="push" data-edit="1" checked> Send a push notification</label>
<button class="btn p big" type="submit" data-te="Save changes">New announcement</button>
<a class="btn big" href="announcements.html" style="justify-content:center">Cancel</a>
<a class="btn d big only-edit" href="#" style="justify-content:center" data-confirm="Delete this announcement?" data-msg="It will be removed from the app straight away." data-done="Announcement deleted" data-go="announcements.html"><span data-i="trash"></span> Delete announcement</a></div></div></div>
