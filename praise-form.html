<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post praise report · KP Global Admin</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem('kp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head><body data-page="praise-reports"><div class="app" id="app"><aside class="side" id="side"></aside><div class="scrim" id="scrim"></div>
<main class="main"><div class="top"><button class="ib ham" id="ham" aria-label="Open menu"></button><div class="crumb"><a href="dashboard.html">KP Global</a> / <a href="praise-reports.html">Praise Reports</a> / <b>Post praise report</b></div>
<div class="tools"><a class="ib" href="notifications.html" aria-label="Notifications"><span data-i="notify"></span><span class="dot"></span></a><button class="ib" id="theme"></button></div></div>
<div class="stage"><a class="back" href="praise-reports.html"><span data-i="back"></span>Praise Reports</a>
<div class="ph"><div><h1 data-te="Edit praise report">Post praise report</h1><div class="sub" data-te="Update the details below, then save your changes.">Fill in the details below. You can edit this later.</div></div></div>
<form class="fgrid" data-saved="Praise report saved" data-edit-title="Edit praise report" data-next="praise-reports.html">
<div class="card"><div class="f wide"><label>Title<input name="title" type="text" placeholder="e.g. A safe delivery" data-edit="God provided a job" required></label><label>Praise report<textarea name="story" rows="6" placeholder="What did God do?" data-edit="After 14 months of searching, I received a job offer this week. Every door I knocked on closed, and this one opened without me forcing it. God is faithful."></textarea><small>Keep it short. Members read these in the app.</small></label><div class="cols"><label>Shared by<input name="by" type="text" placeholder="Member name" data-edit="Tunde K."></label><label>Category<select name="cat" data-edit="Provision"><option selected>Healing</option><option>Provision</option><option>Breakthrough</option><option>Salvation</option><option>Restoration</option><option>Other</option></select></label></div></div></div>
<div class="side-c"><div class="card"><div class="f wide"><label>Status<select name="status" data-edit="Published"><option selected>Awaiting review</option><option>Published</option><option>Declined</option></select></label><label class="c"><input type="checkbox" name="name" data-edit="1" checked> Show the member’s name</label>
<button class="btn p big" type="submit" data-te="Save changes">Post praise report</button>
<a class="btn big" href="praise-reports.html" style="justify-content:center">Cancel</a>
<a class="btn d big only-edit" href="#" style="justify-content:center" data-confirm="Delete this praise report?" data-msg="It will be removed from the app straight away." data-done="Praise report deleted" data-go="praise-reports.html"><span data-i="trash"></span> Delete praise report</a></div></div></div>
</form></div></main></div><script src="assets/app.js"></script></body></html>
